# @package _global_

defaults:
  - _self_
  - diffusion: ddpm_ada_noise
  - model: unet_cond_ca_cpd25
  - dataset: CASIA_file
  - paths: gpu_cluster            

latent_diffusion: true

constants:
  seed: 0
  image_size: -1
  input_channels: -1
  n_classes: 0

training:
  precision: 16
  batch_size: 64
  num_workers: 2
  pin_memory: true
  steps: 250_000
  steps_between_sampling: 1000
  steps_between_eval: 50000
  steps_between_logging: 50
  steps_of_checkpoints:
    - 10_000
    - 25_000
    - 50_000
    - 75_000
    - 100_000
    - 125_000
    - 150_000
    - 175_000
    - 200_000
    - 225_000
    - 250_000
  context_dropout: 0.0
  context_permutation: 0.0
  ema:
    _partial_: true
    _target_: utils.ema.EMAModel
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999
  optimizer:
    _partial_: true
    _target_: torch.optim.Adam
    lr: 1e-4
  lr_scheduler:
    _partial_: true
    _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
    T_0: 10_000
    T_mult: 2
  checkpoint:
    restore: false
    path: "${paths.root}/outputs/resume"
    VQEncoder: "${paths.root}/ckpt/autoencoder/first_stage_encoder_state_dict.pt"
    VQDecoder: "${paths.root}/ckpt/autoencoder/first_stage_decoder_state_dict.pt"

hydra:
  job:
    chdir: true
  run:
    dir: ${paths.root}/outputs/${now:%Y-%m-%d-%H-%M-%S}
